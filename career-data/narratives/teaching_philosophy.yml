    My practice is grounded in the belief that language acquisition and conceptual learning are inseparable. 
    I create inclusive, inquiry-led environments where EAL learners are supported through rigorous scaffolding 
    while maintaining high cognitive expectations. Learning should be culturally responsive, collaborative, 
    and connected to real-world contexts, ensuring every student has the tools to access the curriculum and thrive.
