  </g>

  <text x="80" y="490" font-family="'Manrope', sans-serif" font-size="11" fill="#64748B">Date of Completion: July 2025</text>
  <text x="720" y="490" font-family="'Manrope', sans-serif" font-size="11" fill="#059669" font-weight="bold" text-anchor="end">✓ Repository Verified (E-2005)</text>

  <rect x="20" y="515" width="760" height="25" fill="#1B365D" rx="0 0 4 4"/>
  <text x="400" y="532" font-family="'Manrope', sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle" font-weight="500">DOCUMENTARY EVIDENCE PREVIEW — SENSITIVE IDENTIFIERS REDACTED FOR PRIVACY</text>
