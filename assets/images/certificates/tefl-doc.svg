<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="parchment3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#parchment3)" rx="8" filter="url(#shadow3)"/>
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#1B365D" stroke-width="3" rx="4"/>
  <rect x="28" y="28" width="744" height="504" fill="none" stroke="#C5A059" stroke-width="1.5"/>

  <!-- Logo Header -->
