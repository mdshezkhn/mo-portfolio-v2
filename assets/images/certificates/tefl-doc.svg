  </g>

  <text x="400" y="130" font-family="'Fraunces', serif" font-size="24" font-weight="bold" fill="#1B365D" text-anchor="middle" letter-spacing="2">TEACHER RECORD</text>
  <text x="400" y="150" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="3">INTERNATIONAL TEFL ACCREDITATION</text>

  <line x1="250" y1="165" x2="550" y2="165" stroke="#C5A059" stroke-width="1.5"/>

  <text x="400" y="195" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#475569" text-anchor="middle">This is to certify that</text>
  
  <text x="400" y="235" font-family="'Fraunces', serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">MOHAMMED SHEHZAD KHAN</text>

  <text x="400" y="270" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#475569" text-anchor="middle">has completed 120 hours of instruction in</text>

  <text x="400" y="308" font-family="'Fraunces', serif" font-size="22" font-weight="bold" fill="#1B365D" text-anchor="middle">TEFL CERTIFICATION (120 HOURS)</text>
  <text x="400" y="332" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#C5A059" text-anchor="middle">Teaching English as a Foreign Language</text>

  <!-- Redactions -->
