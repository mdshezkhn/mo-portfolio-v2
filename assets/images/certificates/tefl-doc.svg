    <text x="105" y="17" font-family="'Manrope', sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle">[CERTIFICATE ID REDACTED]</text>
  </g>

  <g transform="translate(450, 395)">
    <rect width="210" height="26" fill="#0F172A" rx="4"/>
    <text x="105" y="17" font-family="'Manrope', sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle">[VERIFICATION LINK REDACTED]</text>
  </g>

  <g transform="translate(400, 465)">
