<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="2in" viewBox="0 0 1050 600">
    <!-- Background -->
    <rect width="1050" height="600" fill="#1E3A5F" />

    <!-- Accent Bar -->
    <rect width="1050" height="20" fill="#0091FF" />

    <!-- Scan to Connect Header -->
    <text x="525" y="120" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Scan to Connect</text>

    <!-- QR Codes Area -->
    <!-- Portfolio QR -->
    <rect x="230" y="200" width="220" height="220" fill="#FFFFFF" rx="12" />
    <image x="245" y="215" width="190" height="190" href="{{ PORTFOLIO_QR_HREF }}" />
    <text x="340" y="470" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DIGITAL PORTFOLIO</text>
    <text x="340" y="500" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">Scan to view my portfolio</text>

    <!-- WeChat QR -->
    <rect x="600" y="200" width="220" height="220" fill="#FFFFFF" rx="12" />
    <image x="615" y="215" width="190" height="190" href="{{ WECHAT_QR_HREF }}" />
    <text x="710" y="470" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">WECHAT</text>
    <text x="710" y="500" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">Scan to connect — China recruiters &amp; schools</text>
</svg>
