        - generic [ref=f1e52]:
          - heading "My Story" [level=2] [ref=f1e53]
          - paragraph [ref=f1e54]: My teaching career began in Mumbai before taking me to mainland China in 2016.
          - heading "My Journey" [level=3] [ref=f1e55]
          - paragraph [ref=f1e56]:
            - text: Since then, my experience has spanned
            - strong [ref=f1e57]: kindergarten through secondary education
            - text: ", giving me a broad understanding of learners across developmental stages. After teaching in"
            - strong [ref=f1e58]: Shenzhen and Huzhou
            - text: ", I found my professional home in"
            - strong [ref=f1e59]: Zhengzhou's bilingual international schools
            - text: ", where I have spent the majority of my career teaching"
            - strong [ref=f1e60]: Primary Years 1–6
            - text: . My work has centred on
            - strong [ref=f1e61]: English as an Additional Language (EAL)
            - text: ", using language as a bridge to"
            - strong [ref=f1e62]: Science, Mathematics, and cross-curricular inquiry
            - text: so that multilingual learners develop both
            - strong [ref=f1e63]: academic English
            - text: and
            - strong [ref=f1e64]: deep conceptual understanding
            - text: . Alongside my classroom responsibilities, I have led
            - strong [ref=f1e65]: Grade 5 writing moderation
            - text: and
            - strong [ref=f1e66]: mentored newly appointed teachers
            - text: .
          - heading "Research-informed Practice" [level=3] [ref=f1e67]
          - paragraph [ref=f1e68]:
            - text: My practitioner research for the
            - strong [ref=f1e69]: PGCE
            - text: ", University of Cumbria examined how questioning strategies facilitate high-quality teaching and participation equity in bilingual classrooms. That work, grounded in Alexander's"
            - strong [ref=f1e70]: dialogic teaching
            - text: framework and translanguaging theory, changed how I plan and run discussions. I now build structured wait time and open-ended questioning sequences into lessons deliberately, not as an afterthought — and I can see the difference in which students engage.
          - heading "Leadership Beyond the Classroom" [level=3] [ref=f1e71]
          - paragraph [ref=f1e72]:
            - text: Beyond my own classroom, I have demonstrated the capacity to elevate instructional quality. At
            - strong [ref=f1e73]: WhiteHat Jr
            - text: ", I conducted quality assurance reviews for educators, using LMS analytics to identify teaching inconsistencies and recommend targeted improvements. At"
            - strong [ref=f1e74]: GEDU Global Education
            - text: ", I delivered international professional development, designing and facilitating pedagogical training for trainers across campuses in the UK, Dubai, and Malta. Those roles reinforced that good teaching and good coaching require the same discipline: specific feedback, clear standards, and honest accountability."
          - heading "Looking Ahead" [level=3] [ref=f1e75]
          - paragraph [ref=f1e76]:
            - text: I hold a Postgraduate Certificate in Education (PGCE), University of Cumbria, a B.Ed (University of Kashmir), and a B.Sc. in Physics. The physics degree directly supports the cross-curricular STEM integration work I bring to primary classrooms. I am seeking an August 2027 position in an international or UK-aligned school where I can contribute to curriculum development and
            - strong [ref=f1e77]: instructional leadership
            - text: .
