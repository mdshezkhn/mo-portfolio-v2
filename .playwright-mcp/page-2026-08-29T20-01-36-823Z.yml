    - region [ref=f3e298]:
      - generic [ref=f3e299]:
        - generic [ref=f3e300]: Teaching Philosophy
        - heading [level=2] [ref=f3e301]:
          - text: How I
          - emphasis [ref=f3e302]: Teach & Lead
        - generic [ref=f3e303]:
          - generic [ref=f3e304]: "\"Language is not a barrier to learning – it is the bridge. When we design for multilingual learners first, we design better for everyone.\""
          - generic [ref=f3e305]:
            - generic [ref=f3e306]:
              - heading "Dialogic Teaching" [level=3] [ref=f3e307]
              - paragraph [ref=f3e308]: Grounded in Alexander's framework, I structure classrooms around high-quality talk – structured wait time, open-ended questioning, and cumulative dialogue where ideas build on each other. This shifts participation from the confident few to the whole class.
            - generic [ref=f3e309]:
              - heading "Translanguaging as Pedagogy" [level=3] [ref=f3e310]
              - paragraph [ref=f3e311]: Students' full linguistic repertoires are assets, not obstacles. I design lessons where learners move fluidly between languages to construct meaning, develop academic English, and demonstrate conceptual understanding in science and mathematics.
            - generic [ref=f3e312]:
              - heading "STEM Integration Through Inquiry" [level=3] [ref=f3e313]
              - paragraph [ref=f3e314]: My physics background informs a 5E-model approach (Engage, Explore, Explain, Elaborate, Evaluate) where language development and scientific reasoning advance together – not in sequence.
            - generic [ref=f3e315]:
              - heading "Assessment for Learning" [level=3] [ref=f3e316]
              - paragraph [ref=f3e317]: "Formative assessment is embedded in every lesson: hinge questions, exit tickets, and student self-assessment against co-constructed criteria. This makes learning visible to both teacher and learner."
