          - text: Leading
          - emphasis [ref=f3e388]: Learning & Development
        - generic [ref=f3e389]:
          - generic [ref=f3e390]: "\"Good teaching and good coaching require the same discipline: specific feedback, clear standards, and honest accountability.\""
          - generic [ref=f3e391]:
            - generic [ref=f3e392]:
              - heading "Teacher Mentoring & Coaching" [level=3] [ref=f3e393]
              - paragraph [ref=f3e394]: Mentored early-career teachers through structured induction programmes – weekly observations, targeted feedback cycles, and collaborative planning. Mentees consistently rated "effective" or above on end-of-year evaluations.
            - generic [ref=f3e395]:
              - heading "Professional Development Design" [level=3] [ref=f3e396]
              - paragraph [ref=f3e397]: Designed and facilitated pedagogical training for trainers across UK, Dubai, and Malta campuses (GEDU Global Education). Programmes covered dialogic teaching, EAL strategies, and assessment for learning.
            - generic [ref=f3e398]:
