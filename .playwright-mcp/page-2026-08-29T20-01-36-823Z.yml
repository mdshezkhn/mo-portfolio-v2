    - region [ref=f3e367]:
      - generic [ref=f3e368]:
        - generic [ref=f3e369]: Practitioner Research
        - heading [level=2] [ref=f3e370]:
          - text: Evidence-Informed
          - emphasis [ref=f3e371]: Practice
        - generic [ref=f3e372]:
          - heading "Questioning Strategies for Participation Equity in Bilingual Classrooms" [level=3] [ref=f3e373]
          - paragraph [ref=f3e374]: PGCE Practitioner Research • University of Cumbria • 2025–2026
          - generic [ref=f3e375]:
            - paragraph [ref=f3e376]: This study examined how structured questioning sequences – combining extended wait time, open-ended prompts, and dialogic follow-ups – affect participation patterns among multilingual learners in primary bilingual settings.
            - paragraph [ref=f3e377]: "Key implications: wait time must be explicitly taught and modelled; question sequences should be pre-plaed, not improvised; and translanguaging scaffolds enable learners to rehearse ideas in stronger language before expressing in English."
        - paragraph [ref=f3e378]: ◀ Earlier Enquiries & Professional Learning ◀
        - generic [ref=f3e379]:
          - heading "Teacher Quality Assurance at Scale" [level=3] [ref=f3e380]
          - paragraph [ref=f3e381]: WhiteHat Jr • 2020–2022
          - paragraph [ref=f3e383]: Analysis of LMS data was used to identify instructional quality indicators and develop a scalable observation framework for remote teaching contexts.
