verification_rules:
  master:
    employment:
      approved_statuses: [approved]
    claims:
      required:
        - valid_edge_to_employment
        - valid_edge_to_evidence

policies:
  master:
    description: "The exhaustive Master CV presentation scope."
    presentation_scope:
      employers: "ALL_VERIFIED"
      education: "ALL_VERIFIED"
      claims: "ALL_VERIFIED"
    sorting: "CHRONOLOGICAL_DESCENDING"
    group_by: "ORGANIZATION"
    
  portfolio:
    description: "The Public Portfolio marketing presentation scope."
    presentation_scope:
      employers: "ALL_VERIFIED"
      education: "ALL_VERIFIED"
      claims: "ALL_VERIFIED"
    employment:
      require_verified_claim: true   # Employment appears only if ≥1 presentation claim is VERIFIED
    sorting: "CHRONOLOGICAL_DESCENDING"
    group_by: "ORGANIZATION"
    

