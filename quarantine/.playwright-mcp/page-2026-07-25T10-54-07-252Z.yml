            - heading "How do questioning strategies facilitate high-quality teaching and participation equity in bilingual classrooms?" [level=3] [ref=f7e475]
            - paragraph [ref=f7e476]: Practitioner research examining how questioning strategies can be used to facilitate high-quality teaching and learning and support participation equity in a bilingual primary classroom.
            - heading "How this research changed my classroom" [level=3] [ref=f7e477]
            - paragraph [ref=f7e478]: This research sharpened my use of structured questioning in daily lessons. I now plan open-ended questions in advance, build in deliberate wait time, and sequence discussions so that quieter multilingual learners have multiple low-stakes entry points before whole-class sharing. The result has been broader participation — particularly among students who previously relied on stronger English speakers to answer first.
