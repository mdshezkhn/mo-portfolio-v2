<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBFA"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
  </defs>

  <!-- Parchment Background -->
  <rect width="800" height="560" fill="url(#parchment)" rx="8" filter="url(#shadow)"/>
  
  <!-- Outer Double Border -->
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#1E3A5F" stroke-width="3" rx="4"/>
  <rect x="28" y="28" width="744" height="504" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Header Coat of Arms / Logo Placeholder -->
  <g transform="translate(400, 75)">
    <circle cx="0" cy="0" r="30" fill="#1E3A5F"/>
    <path d="M-15 -10 L0 -22 L15 -10 L15 10 C15 18 0 24 0 24 C0 24 -15 18 -15 10 Z" fill="#C5A059"/>
    <text x="0" y="5" font-family="'Fraunces', serif" font-size="10" font-weight="bold" fill="#1E3A5F" text-anchor="middle">UC</text>
  </g>

  <!-- University Heading -->
  <text x="400" y="130" font-family="'Fraunces', 'Georgia', serif" font-size="24" font-weight="bold" fill="#1E3A5F" text-anchor="middle" letter-spacing="2">UNIVERSITY OF CUMBRIA</text>
  <text x="400" y="150" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="3">UNITED KINGDOM</text>

  <!-- Divider Line -->
  <line x1="250" y1="165" x2="550" y2="165" stroke="#C5A059" stroke-width="1.5"/>

  <!-- Body Text -->
  <text x="400" y="195" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#475569" text-anchor="middle">This is to certify that</text>
  
  <!-- Candidate Name -->
  <text x="400" y="235" font-family="'Fraunces', 'Georgia', serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">MOHAMMED SHEHZAD KHAN</text>

  <text x="400" y="270" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#475569" text-anchor="middle">has been awarded the qualification of</text>

  <!-- Award Title -->
  <text x="400" y="308" font-family="'Fraunces', 'Georgia', serif" font-size="22" font-weight="bold" fill="#1E3A5F" text-anchor="middle">Postgraduate Certificate in Education (PGCE)</text>
  <text x="400" y="332" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#C5A059" text-anchor="middle">Primary Education • Master's Level (60 Credits)</text>

  <!-- Redaction Stamp (Privacy by Design) -->
  <g transform="translate(140, 395)">
    <rect width="210" height="26" fill="#0F172A" rx="4"/>
    <text x="105" y="17" font-family="'Manrope', sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">[STUDENT ID REDACTED]</text>
  </g>

  <g transform="translate(450, 395)">
    <rect width="210" height="26" fill="#0F172A" rx="4"/>
    <text x="105" y="17" font-family="'Manrope', sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">[CERT NO. REDACTED]</text>
  </g>

  <!-- Official Seal -->
  <g transform="translate(400, 465)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#C5A059" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="0" y="-5" font-family="'Manrope', sans-serif" font-size="8" font-weight="bold" fill="#C5A059" text-anchor="middle">OFFICIAL SEAL</text>
    <text x="0" y="8" font-family="'Fraunces', serif" font-size="11" font-weight="bold" fill="#1E3A5F" text-anchor="middle">CUMBRIA</text>
  </g>

  <!-- Date & Verification Notice -->
  <text x="80" y="490" font-family="'Manrope', sans-serif" font-size="11" fill="#64748B">Date of Award: Academic Year 2025–2026</text>
  <text x="720" y="490" font-family="'Manrope', sans-serif" font-size="11" fill="#059669" font-weight="bold" text-anchor="end">✓ Repository Verified (E-2001)</text>

  <!-- Privacy Footer Banner -->
  <rect x="20" y="515" width="760" height="25" fill="#1E3A5F" rx="0 0 4 4"/>
  <text x="400" y="532" font-family="'Manrope', sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle" font-weight="500">DOCUMENTARY EVIDENCE PREVIEW — SENSITIVE IDENTIFIERS REDACTED FOR PRIVACY</text>
</svg>