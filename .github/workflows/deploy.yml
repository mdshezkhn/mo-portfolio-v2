name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: CI Validation Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify script exists
        run: |
          ls -la scripts/audit_claims.py
          python scripts/audit_claims.py

      - name: Test subprocess with audit_claims.py
        run: |
          python -c "import subprocess, sys, os; env = os.environ.copy(); env['PYTHONIOENCODING'] = 'utf-8'; result = subprocess.run([sys.executable, 'scripts/audit_claims.py'], capture_output=True, text=True, encoding='utf-8', env=env, cwd='.'); print('STDOUT:', result.stdout); print('STDERR:', result.stderr); print('Return code:', result.returncode); exit(0 if result.returncode == 0 else 1)"

      - name: Test first stage of ci_pipeline.py
        run: |
          python -c "
import subprocess, sys, os
env = os.environ.copy()
env['PYTHONIOENCODING'] = 'utf-8'
cmd = [sys.executable, 'scripts/audit_claims.py']
print('Running:', cmd)
result = subprocess.run(cmd, capture_output=True, text=True, encoding='utf-8', env=env, cwd='.')
print('STDOUT:', result.stdout)
print('STDERR:', result.stderr)
print('Return code:', result.returncode)
exit(0 if result.returncode == 0 else 1)
"

      - name: Run CI Validation Pipeline
        run: python scripts/ci_pipeline.py

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './mo-portfolio-v2'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4