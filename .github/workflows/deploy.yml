name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: CI Validation Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug environment
        run: |
          python --version
          pip list
          pwd
          ls -la
      - name: Test imports
        run: |
          python -c "import sys; print('Python:', sys.version); import yaml, pytest, bs4, requests, jsonschema, qrcode, vobject, svglib, reportlab, PyPDF2; print('All imports OK')"
      - name: Test first script
        run: |
          python scripts/audit_claims.py
      - name: Run CI Validation Pipeline
        run: python scripts/ci_pipeline.py

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './mo-portfolio-v2'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
